name: Build Media3 Demo APK
on:
  workflow_dispatch: # ✅ 网页手动点按钮触发编译，不用推送代码
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build demos/main Demo Debug APK
        run: ./gradlew :demos:main:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-demo-apk
          path: demos/main/build/outputs/apk/debug/*.apk

